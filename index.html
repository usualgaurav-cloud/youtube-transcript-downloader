<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Transcript Downloader</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <header>
    <h1>YouTube Transcript Downloader</h1>
    <p>Download transcripts from multiple YouTube videos at once.</p>
  </header>

  <main>
    <section>
      <h2>Download transcripts</h2>

      <textarea
        id="urls"
        placeholder="Paste YouTube URLs, one per line"
        rows="10"
        cols="50"
      ></textarea>

      <button id="download">Download Transcripts</button>
    </section>
  </main>

  <script src="/static/script.js"></script>

</body>
</html>
